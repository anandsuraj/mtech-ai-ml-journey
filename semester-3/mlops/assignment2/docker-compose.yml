version: "3.9"

services:
  inference-service:
    image: cats-dogs-mlops:latest
    container_name: cats-dogs-inference
    ports:
      - "8000:8000"
    restart: always

version: "3.9"

services:

  inference-service:
    image: YOUR_DOCKER_USER/binary-image-classification-mlops:latest
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"