name: Run Tests

on:
  push:
    branches:
      - development
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pytest.yml"

  pull_request:
    branches:
      - development
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Debug (optional but useful)
      - name: Show project structure
        run: |
          pwd
          ls -la
          ls -la tests

      # Collect tests
      - name: Collect Tests
        run: pytest --collect-only -q

      # Run tests
      - name: Run pytest
        run: pytest --maxfail=1 --disable-warnings -W ignore::DeprecationWarning -v --cov=src tests/